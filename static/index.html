<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Usage</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--surface:rgba(255,255,255,.82);--surface-strong:#fff;--text:#172033;--muted:#667085;--line:#e4e8f0;--shadow:0 18px 50px rgba(30,42,70,.10);--accent:#6757e8;--accent-2:#27b3a4;--track:#e9eaf6}
:root[data-theme="dark"]{--bg:#0d111b;--surface:rgba(22,28,42,.88);--surface-strong:#161c2a;--text:#f3f5fa;--muted:#9ba6ba;--line:#2a3346;--shadow:0 20px 60px rgba(0,0,0,.28);--accent:#9a8cff;--accent-2:#55d4c6;--track:#30364a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d111b;--surface:rgba(22,28,42,.88);--surface-strong:#161c2a;--text:#f3f5fa;--muted:#9ba6ba;--line:#2a3346;--shadow:0 20px 60px rgba(0,0,0,.28);--accent:#9a8cff;--accent-2:#55d4c6;--track:#30364a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(103,87,232,.13),transparent 32rem),radial-gradient(circle at 90% 10%,rgba(39,179,164,.12),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}.shell{width:min(100% - 32px,940px);margin:0 auto;padding:42px 0 48px}.topbar{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:20px;margin-bottom:30px;text-align:center}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{margin:0;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.055em;line-height:1}.subtitle{margin:12px 0 0;color:var(--muted);font-size:.98rem}.theme{position:absolute;right:0;top:0;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--text);font:inherit;font-size:.78rem;cursor:pointer;transition:transform .2s,background .2s}.theme:hover{transform:translateY(-1px);background:var(--surface-strong)}.status{display:flex;align-items:center;gap:8px;margin:0 0 18px;color:var(--muted);font-size:.84rem}.status.ok{color:var(--accent-2)}.status.bad{color:#ef7184}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 14%,transparent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{position:relative;overflow:hidden;padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.9}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.provider{margin:0;font-size:.86rem;letter-spacing:.13em}.live{padding:5px 9px;border:1px solid color-mix(in srgb,var(--accent-2) 30%,transparent);border-radius:999px;color:var(--accent-2);font-size:.7rem;font-weight:800;letter-spacing:.08em}.main{display:flex;align-items:center;gap:24px}.ring{--value:0;position:relative;display:grid;place-items:center;flex:0 0 156px;width:156px;height:156px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--value) * 1%),var(--track) 0);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface-strong);box-shadow:inset 0 0 0 1px var(--line)}.ring-content{position:relative;z-index:1;text-align:center}.ring-number{display:block;font-size:2rem;font-weight:800;letter-spacing:-.06em}.ring-label{display:block;margin-top:2px;color:var(--muted);font-size:.72rem}.metrics{display:grid;gap:14px;min-width:0;flex:1}.metric-label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:4px}.metric-value{font-size:1rem;font-weight:750}.reset{font-variant-numeric:tabular-nums}.age{margin:22px 0 0;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem}.age strong{color:var(--text);font-weight:650}.footer{margin-top:20px;text-align:center;color:var(--muted);font-size:.75rem}@media(max-width:680px){.shell{width:min(100% - 22px,940px);padding-top:26px}.topbar{display:block}.theme{margin-top:18px;width:max-content}.grid{grid-template-columns:1fr}.card{padding:22px}.main{gap:18px}.ring{flex-basis:132px;width:132px;height:132px}.ring-number{font-size:1.7rem}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div><p class="eyebrow">Usage monitor</p><h1 class="title">AI subscriptions</h1><p class="subtitle">Live account limits from the official provider pages.</p></div><button class="theme" id="theme-toggle" type="button" aria-label="Toggle color theme">☾ Dark</button></header>
  <p id="status" class="status"><span class="dot"></span><span>Connecting…</span></p>
  <div class="grid">
    <section class="card"><div class="card-head"><h2 class="provider">CODEX</h2><span class="live">LIVE</span></div><div class="main"><div class="ring" id="codex-ring"><div class="ring-content"><span id="codex-five" class="ring-number">—</span><span class="ring-label">remaining</span></div></div><div class="metrics"><div><span class="metric-label">Weekly remaining</span><span id="codex-week" class="metric-value">—</span></div><div><span class="metric-label">Next reset</span><span id="codex-reset" class="metric-value reset">—</span></div></div></div><p class="age">Last checked <strong id="codex-age">—</strong></p></section>
    <section class="card"><div class="card-head"><h2 class="provider">CLAUDE</h2><span class="live">LIVE</span></div><div class="main"><div class="ring" id="claude-ring"><div class="ring-content"><span id="claude-five" class="ring-number">—</span><span class="ring-label">remaining</span></div></div><div class="metrics"><div><span class="metric-label">Weekly remaining</span><span id="claude-week" class="metric-value">—</span></div><div><span class="metric-label">Next reset</span><span id="claude-reset" class="metric-value reset">—</span></div></div></div><p class="age">Last checked <strong id="claude-age">—</strong></p></section>
  </div>
  <p class="footer">The rings show remaining five-hour capacity.</p>
</main>
<script>
let latest={};
try{latest=JSON.parse(localStorage.getItem('ai-usage-last-state')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
const pct=x=>x==null?'—':`${Number(x).toFixed(1)}%`;
const age=ts=>!ts?'—':`${Math.max(0,Math.floor((Date.now()-Date.parse(ts))/1000))} seconds ago`;
const countdown=ts=>{if(!ts)return'—';let s=Math.max(0,Math.floor((Date.parse(ts)-Date.now())/1000));return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`};
function render(s){latest=s;try{localStorage.setItem('ai-usage-last-state',JSON.stringify(s))}catch(e){};for(const p of ['codex','claude']){const x=s[p]||{};const remaining=x.five_hour_remaining;$(`${p}-five`).textContent=pct(remaining);$(`${p}-week`).textContent=pct(x.weekly_remaining);$(`${p}-reset`).textContent=countdown(x.five_hour_reset||x.weekly_reset);$(`${p}-age`).textContent=age(x.last_checked);if(remaining!=null)$(`${p}-ring`).style.setProperty('--value',Math.max(0,Math.min(100,Number(remaining))))}}
setInterval(()=>{for(const p of ['codex','claude']){$(`${p}-reset`).textContent=countdown((latest[p]||{}).five_hour_reset||(latest[p]||{}).weekly_reset);$(`${p}-age`).textContent=age((latest[p]||{}).last_checked)}},1000);
const theme=$('theme-toggle');const saved=localStorage.getItem('ai-usage-theme')||'system';if(saved!=='system')document.documentElement.dataset.theme=saved;function syncTheme(){const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);theme.textContent=dark?'☀ Light':'☾ Dark';theme.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')}theme.onclick=()=>{const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);const next=dark?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('ai-usage-theme',next);syncTheme()};syncTheme();
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{$('status').innerHTML='<span class="dot"></span><span>Live · WebSocket connected</span>';$('status').className='status ok'};ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>{$('status').innerHTML='<span class="dot"></span><span>Disconnected · retrying</span>';$('status').className='status bad';setTimeout(connect,2000)}}
render(latest);fetch('/api/usage').then(r=>r.ok?r.json():null).then(s=>{if(s)render(s)}).catch(()=>{});connect();
</script>
</body>
</html>
